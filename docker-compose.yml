services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ictihat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-degistir}
      POSTGRES_DB: ${POSTGRES_DB:-ictihat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ictihat} -d ${POSTGRES_DB:-ictihat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ictihat}:${POSTGRES_PASSWORD:-degistir}@db:5432/${POSTGRES_DB:-ictihat}
    ports:
      - "8000:8000"
    volumes:
      # Embedding modeli (~2,2 GB) bir kez indirilir ve burada saklanır
      - models:/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_MOCK_SEARCH: ${NEXT_PUBLIC_MOCK_SEARCH:-false}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  models:
